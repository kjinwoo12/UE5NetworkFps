[/Script/FpsCoreRuntime.FpsFirstPersonAnimInstance]
; Seconds standing still before the weapon-in-hand grip is captured and locked (stops locomotion sliding the gun in the hand).
GripCaptureSettleSeconds=0.300000
; ...and while neither the view nor the animated chest turns faster than this (deg/s): the chest reference must not be taken mid-turn.
GripCaptureMaxTurnRate=45.000000

[/Script/FpsCoreRuntime.FpsFirstPersonSettings]
; Project Settings > Game > Fps First Person. See Docs/FirstPersonRig.md.
; True first person: camera on the animated head, body = 3P animation. False = legacy split rig.
bTrueFirstPerson=True
EyeBone=head
EyeViewOffset=(X=8.000000,Y=0.000000,Z=10.000000)
; How much the weapon follows the way the animated body carries it (0 = locked to the view), limited and smoothed.
WeaponFollowsBody=0.250000
WeaponSwayMaxOffset=5.000000
WeaponSwayMaxAngle=6.000000
WeaponSwaySmoothing=15.000000
; The sway is measured from the body carry's slow average (interp speed): only the bob passes, not a lasting offset.
WeaponSwayCenterSpeed=2.000000
; The weapon follows the body fully from this ground speed (cm/s), not at all standing still (0 = always).
WeaponSwayFullSpeed=150.000000
; Turn inertia: degrees the weapon trails the view per 100 deg/s, and its limit.
WeaponTurnLag=1.000000
WeaponTurnLagMax=2.000000
; Elbow pole blend, 0 = animated elbow, 1 = elbow that keeps the wrist straight.
PrimaryWristStraighten=0.500000
; ...for the primary arm while moving (the shoulder fit lets the elbow reach the straighter pole).
PrimaryWristStraightenMoving=0.750000
SupportWristStraighten=1.000000
; Elbow poles follow the animation through a low-pass filter in weapon space (interp speed): the walk cycle swung the arm bend plane.
ElbowPoleSmoothingSpeed=3.000000
; Finger bones (and below) that keep the pose captured with the grip while no montage plays: locomotion opened and closed the thumb every step.
!LockedFingerRoots=ClearArray
+LockedFingerRoots=thumb_01_l
+LockedFingerRoots=index_metacarpal_l
+LockedFingerRoots=middle_metacarpal_l
+LockedFingerRoots=ring_metacarpal_l
+LockedFingerRoots=pinky_metacarpal_l
+LockedFingerRoots=thumb_01_r
+LockedFingerRoots=index_metacarpal_r
+LockedFingerRoots=middle_metacarpal_r
+LockedFingerRoots=ring_metacarpal_r
+LockedFingerRoots=pinky_metacarpal_r
FingerLockBlendSpeed=10.000000
; Past this fraction of arm length the clavicle turns toward the hand target (shoulder comes forward).
ReachArmFraction=0.950000
; Shoulders stay at least this far from the camera (shoulder mesh clipped at the screen edge when closer).
MinShoulderCameraDistance=24.000000
; Shoulders follow the animation through a low-pass filter (interp speed): the walk/turn bob made the elbows jerk.
ShoulderSmoothingSpeed=3.000000
; The primary shoulder moves (toward/away from the elbow pole) so the elbow lands on the pole: the wrist then bends as the pole intends while walking. 0 = off.
PrimaryShoulderFitsElbow=1.000000
; Share of that move done by the chest (the clavicle does the rest); more brings the collar toward the camera.
PrimaryShoulderFitChestShare=0.250000
; Low-pass of that move (interp speed): the slow crouch-walk cycle passed through it into the support elbow.
PrimaryShoulderFitSmoothingSpeed=1.000000
; The 1P chest moves by up to this much (cm) so the shoulders sit where the arms need them (arms move with the weapon as one piece).
MaxChestOffset=15.000000
; ...but never brings the neck/collar bones closer to the camera than this (cm), nor closer than the animation has them.
MinChestCameraDistance=14.500000
; Fast turns leave the animated upper body behind the view and leaning; the 1P chest is turned back by up to this many degrees (0 = off).
MaxChestYawCorrection=90.000000
; The chest correction only applies while the view turns (from Start to Full deg/s) and fades at ReleaseSpeed afterwards.
ChestTurnRateStart=60.000000
ChestTurnRateFull=180.000000
ChestCorrectionReleaseSpeed=4.000000
; Engine first person rendering: arms/upper body/weapon drawn as First Person primitives scaled toward the camera (no wall or leg clipping); legs stay in the world layer.
bFirstPersonRendering=True
FirstPersonScale=0.300000
FirstPersonFieldOfView=0.000000
!WorldLayerBones=ClearArray
+WorldLayerBones=thigh_l
+WorldLayerBones=thigh_r
!FirstPersonLayerBones=ClearArray
+FirstPersonLayerBones=spine_01
